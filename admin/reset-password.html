
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialiser le mot de passe | PTK</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 420px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        h1 {
            color: #123b70;
            font-size: 23px;
            text-align: center;
        }

        p {
            color: #555;
            line-height: 1.5;
        }

        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border-radius: 7px;
            font-size: 15px;
        }

        input {
            border: 1px solid #ccc;
        }

        button {
            border: none;
            background: #123b70;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <main class="container">
        <h1>Nouveau mot de passe</h1>
        <p>Choisis un nouveau mot de passe pour accéder à l'administration de PTK.</p>

        <form id="resetForm">
            <input
                type="password"
                id="password"
                placeholder="Nouveau mot de passe"
                minlength="8"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirmer le mot de passe"
                minlength="8"
                required
            >

            <button type="submit" id="submitButton">
                Enregistrer le nouveau mot de passe
            </button>
        </form>

        <p id="message"></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>

    <script>
        const form = document.getElementById("resetForm");
        const message = document.getElementById("message");
        const button = document.getElementById("submitButton");

        async function verifierLien() {
            const { data, error } = await window.ptkSupabase.auth.getSession();

            if (error || !data.session) {
                message.textContent =
                    "Lien invalide ou expiré. Demande un nouvel e-mail de réinitialisation.";
                form.style.display = "none";
                return;
            }

            message.textContent = "Lien vérifié. Tu peux choisir ton nouveau mot de passe.";
        }

        verifierLien();

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const password = document.getElementById("password").value;
            const confirmation = document.getElementById("confirmPassword").value;

            if (password.length < 8) {
                message.textContent = "Le mot de passe doit contenir au moins 8 caractères.";
                return;
            }

            if (password !== confirmation) {
                message.textContent = "Les deux mots de passe ne correspondent pas.";
                return;
            }

            button.disabled = true;
            message.textContent = "Enregistrement en cours...";

            const { error } = await window.ptkSupabase.auth.updateUser({
                password: password
            });

            if (error) {
                message.textContent = "Erreur : " + error.message;
                button.disabled = false;
                return;
            }

            message.textContent = "Mot de passe modifié avec succès. Tu peux maintenant te connecter.";

            await window.ptkSupabase.auth.signOut();
            form.style.display = "none";
        });
    </script>

</body>
</html>
